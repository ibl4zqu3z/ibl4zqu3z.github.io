title: ibl4zqu3z
description: Marca personal de ciberseguridad centrada en pentesting, seguridad ofensiva,
  consultoría y formación.
lang: es
timezone: Europe/Madrid
url: https://ibl4zqu3z.github.io
baseurl: ''
social:
  linkedin: https://es.linkedin.com/in/isaac-blazquez-lopez
  x: https://x.com/ibl4zqu3z
  mastodon: https://mastodon.social/ibl4zqu3z
  youtube: https://www.youtube.com/channel/UCZkmFRilAu3vMytY2ZZu0hA
  website: https://ibl4zqu3z.github.io/
markdown: kramdown
permalink: /blog/:title/
plugins:
- jekyll-sitemap
exclude:
- README-MIGRACION.md
- vendor
- node_modules
collections:
  portfolio:
    output: true
    permalink: /portafolio/:name.html
defaults:
- scope:
    path: ''
  values:
    layout: default
- scope:
    path: ''
    type: posts
  values:
    layout: post
- scope:
    path: ''
    type: portfolio
  values:
    layout: portfolio_item
    nav: portfolio
