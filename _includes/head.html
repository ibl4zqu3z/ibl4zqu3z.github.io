<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="{{ page.description | default: site.description | escape }}" />
<meta name="author" content="{{ site.data.site.author | escape }}" />

<meta name="google-site-verification" content="trQ4XDsmQ2z3jab0Cxf2CZipTbIhMiSXVm0Ly0TYxBU" />


<title>{{ page.title | default: site.title | escape }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700;800&family=Orbitron:wght@400;600;700;900&family=Syne:wght@400;500;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="{{ '/assets/css/custom.css' | relative_url }}" rel="stylesheet" />
{% if page.extra_css %}
  {% for css in page.extra_css %}
<link href="{{ '/' | append: css | relative_url }}" rel="stylesheet" />
  {% endfor %}
{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}" />
